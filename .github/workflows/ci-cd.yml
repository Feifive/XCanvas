name: CI-CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            qt_version: 6.8.3
            qt_arch: clang_64
            artifact_name: XCanvas-macOS
            package_path: dist/XCanvas-macOS-${{ github.ref_name }}.zip
          - name: Windows
            os: windows-latest
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            artifact_name: XCanvas-windows
            package_path: dist/XCanvas-windows-${{ github.ref_name }}.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQT_SDK_DIR="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          app_path="Bin/mac/Release/XCanvas.app"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "${{ matrix.package_path }}"

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $appDir = Join-Path $PWD "Bin/win64/Release"
          $exePath = Join-Path $appDir "XCanvas.exe"
          & (Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe") --release --no-translations --no-opengl-sw $exePath
          Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath "${{ matrix.package_path }}" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
